name: Update live cards

on:
  schedule:
    - cron: "17 15 * * *" # 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/live.yml"]

permissions:
  contents: write

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .fonts
          key: fonts-pretendard-1.3.9-jbmono-2.304
      - run: pip install fonttools
      - name: Fetch the current output branch (keeps the blend demo state)
        run: |
          git clone -q --depth 1 --branch output "https://github.com/${{ github.repository }}.git" dist || mkdir -p dist
          find dist -maxdepth 1 -type f ! -name scent.json -delete
      - run: python scripts/build.py live dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the output branch
        working-directory: dist
        run: |
          rm -rf .git
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update live cards"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
      - name: Refresh the activity log in README
        run: |
          python scripts/build.py activity README.md
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Update activity log" README.md
            git pull -q --rebase
            git push -q
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
