<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">김준성 | 물리에서 아이디어를, 코드로 가능성을</title><desc id="desc">물리 기반 AI, 계산 후각, 소프트웨어를 탐구합니다. 연구 아이디어를 실험하고 코드로 구현합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101B43"/><stop offset=".56" stop-color="#241A4B"/><stop offset="1" stop-color="#0D303D"/></linearGradient><linearGradient id="rainbow"><stop stop-color="#619AFF"/><stop offset=".36" stop-color="#B48AFF"/><stop offset=".7" stop-color="#37D5CD"/><stop offset="1" stop-color="#FFAC72"/></linearGradient><radialGradient id="glow"><stop stop-color="#7863FF" stop-opacity=".45"/><stop offset="1" stop-color="#7863FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94ACF0" stroke-opacity=".08"/></pattern></defs><rect x="1" y="1" width="958" height="418" rx="24" fill="url(#bg)" stroke="#4D4A79" stroke-width="1"/><rect x="1" y="1" width="958" height="418" rx="24" fill="url(#grid)" stroke="none" stroke-width="1"/><path d="M24 2H936" stroke="url(#rainbow)" stroke-width="4"/><style>@keyframes orbit {to {transform:rotate(360deg)}} .orbits {animation:orbit 48s linear infinite;transform-origin:0 0;} @media (prefers-reduced-motion:reduce){.orbits{animation:none}}</style><text x="44" y="49" fill="#AABBEF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="650" letter-spacing="3">JUNSEONG2IM</text><text x="44" y="130" fill="#FFFFFF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="76" font-weight="800" >김준성</text><text x="44" y="190" fill="#DADAF4" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="32" font-weight="650" >물리에서 아이디어를,</text><text x="44" y="236" fill="#DADAF4" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="32" font-weight="650" >코드로 가능성을.</text><text x="44" y="284" fill="#AFBEDF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="400" >연구 아이디어를 실험하고 소프트웨어로 구현합니다.</text><rect x="44" y="330" width="158" height="38" rx="19" fill="#7DA8FF" stroke="none" stroke-width="1"/><text x="123.0" y="356" fill="#101B35" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="650" text-anchor="middle">물리 기반 AI</text><rect x="214" y="330" width="140" height="38" rx="19" fill="#B699FF" stroke="none" stroke-width="1"/><text x="284.0" y="356" fill="#101B35" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="650" text-anchor="middle">계산 후각</text><rect x="366" y="330" width="160" height="38" rx="19" fill="#55DFCC" stroke="none" stroke-width="1"/><text x="446.0" y="356" fill="#101B35" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="650" text-anchor="middle">소프트웨어</text><g transform="translate(761 193) scale(1)"><circle r="180" fill="url(#glow)"/><circle r="128" fill="#16234E" fill-opacity=".5" stroke="#56639B" stroke-opacity=".35"/><g class="orbits"><ellipse rx="144" ry="53" transform="rotate(-30)" fill="none" stroke="#7DA8FF" stroke-opacity=".75" stroke-width="1.6"/><ellipse rx="144" ry="53" transform="rotate(35)" fill="none" stroke="#B699FF" stroke-opacity=".75" stroke-width="1.6"/><ellipse rx="144" ry="53" transform="rotate(90)" fill="none" stroke="#55DFCC" stroke-opacity=".75" stroke-width="1.6"/></g><circle r="37" fill="#7B6CE8" fill-opacity=".15" stroke="#9F9BFF" stroke-opacity=".55"/><circle r="22" fill="#E0DCFF"/><path d="M-10 0L-3-11L10 0L-3 11Z" fill="#6653CC"/><circle cx="-114" cy="-56" r="16" fill="#7DA8FF" fill-opacity=".1"/><circle cx="-114" cy="-56" r="7" fill="#7DA8FF"/><circle cx="113" cy="-66" r="16" fill="#B699FF" fill-opacity=".1"/><circle cx="113" cy="-66" r="7" fill="#B699FF"/><circle cx="42" cy="123" r="16" fill="#55DFCC" fill-opacity=".1"/><circle cx="42" cy="123" r="7" fill="#55DFCC"/><circle cx="-98" cy="73" r="16" fill="#FFB578" fill-opacity=".1"/><circle cx="-98" cy="73" r="7" fill="#FFB578"/></g><text x="761" y="375" fill="#C2C9E7" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="500" text-anchor="middle">연결 · 실험 · 구현</text></svg>