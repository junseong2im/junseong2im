<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc"><title id="title">김준성 | 물리에서 아이디어를, 코드로 가능성을</title><desc id="desc">물리 기반 AI, 계산 후각, 소프트웨어를 탐구합니다. 연구 아이디어를 실험하고 코드로 구현합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101B43"/><stop offset=".56" stop-color="#241A4B"/><stop offset="1" stop-color="#0D303D"/></linearGradient><linearGradient id="rainbow"><stop stop-color="#619AFF"/><stop offset=".36" stop-color="#B48AFF"/><stop offset=".7" stop-color="#37D5CD"/><stop offset="1" stop-color="#FFAC72"/></linearGradient><radialGradient id="glow"><stop stop-color="#7863FF" stop-opacity=".45"/><stop offset="1" stop-color="#7863FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94ACF0" stroke-opacity=".08"/></pattern></defs><rect x="1" y="1" width="598" height="538" rx="24" fill="url(#bg)" stroke="#4D4A79" stroke-width="1"/><rect x="1" y="1" width="598" height="538" rx="24" fill="url(#grid)" stroke="none" stroke-width="1"/><path d="M24 2H576" stroke="url(#rainbow)" stroke-width="4"/><style>@keyframes orbit {to {transform:rotate(360deg)}} .orbits {animation:orbit 48s linear infinite;transform-origin:0 0;} @media (prefers-reduced-motion:reduce){.orbits{animation:none}}</style><text x="34" y="49" fill="#AABBEF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="650" letter-spacing="3">JUNSEONG2IM</text><text x="34" y="130" fill="#FFFFFF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="72" font-weight="800" >김준성</text><text x="34" y="188" fill="#DADAF4" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="29" font-weight="650" >물리에서 아이디어를,</text><text x="34" y="229" fill="#DADAF4" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="29" font-weight="650" >코드로 가능성을.</text><g transform="translate(441 149) scale(0.73)"><circle r="180" fill="url(#glow)"/><circle r="128" fill="#16234E" fill-opacity=".5" stroke="#56639B" stroke-opacity=".35"/><g class="orbits"><ellipse rx="144" ry="53" transform="rotate(-30)" fill="none" stroke="#7DA8FF" stroke-opacity=".75" stroke-width="1.6"/><ellipse rx="144" ry="53" transform="rotate(35)" fill="none" stroke="#B699FF" stroke-opacity=".75" stroke-width="1.6"/><ellipse rx="144" ry="53" transform="rotate(90)" fill="none" stroke="#55DFCC" stroke-opacity=".75" stroke-width="1.6"/></g><circle r="37" fill="#7B6CE8" fill-opacity=".15" stroke="#9F9BFF" stroke-opacity=".55"/><circle r="22" fill="#E0DCFF"/><path d="M-10 0L-3-11L10 0L-3 11Z" fill="#6653CC"/><circle cx="-114" cy="-56" r="16" fill="#7DA8FF" fill-opacity=".1"/><circle cx="-114" cy="-56" r="7" fill="#7DA8FF"/><circle cx="113" cy="-66" r="16" fill="#B699FF" fill-opacity=".1"/><circle cx="113" cy="-66" r="7" fill="#B699FF"/><circle cx="42" cy="123" r="16" fill="#55DFCC" fill-opacity=".1"/><circle cx="42" cy="123" r="7" fill="#55DFCC"/><circle cx="-98" cy="73" r="16" fill="#FFB578" fill-opacity=".1"/><circle cx="-98" cy="73" r="7" fill="#FFB578"/></g><rect x="32" y="280" width="536" height="126" rx="18" fill="#10182F" stroke="#4A4775" stroke-width="1"/><text x="55" y="322" fill="#CCD6EF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="400" >연구 아이디어를 실험하고</text><text x="55" y="359" fill="#CCD6EF" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="23" font-weight="400" >소프트웨어로 구현합니다.</text><rect x="32" y="445" width="158" height="38" rx="19" fill="#7DA8FF" stroke="none" stroke-width="1"/><text x="111.0" y="471" fill="#101B35" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',